# Rust 本体の版は rust-toolchain.toml で固定する。ここでは、ほかの道具の版と、よく使うタスクを決める。
[tools]
"github:trunk-rs/trunk" = "0.21.14"

[tasks.verify]
description = "fmt・clippy・テスト（GPU は使わない）"
run = [
    "cargo fmt --check",
    "cargo clippy --all-targets -- -D warnings",
    "cargo test",
]

[tasks.check]
description = "回帰：0・1・5 秒、二度目の裏返し、リセットを基準のハッシュと比べる（GPU を使う。sandbox の外で）"
run = "cargo run --release --example check"

[tasks.check-full]
description = "回帰：同じものを 60 秒まで（GPU を 3〜4 分使う）"
run = "cargo run --release --example check -- --full"

[tasks.web]
description = "Web 向けにビルドして http://127.0.0.1:8080 で配る"
run = "trunk serve"
