[package]
name = "sand-picture"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
autobins = false
publish = false

[dependencies]
mikage = { git = "https://github.com/necocen/mikage.git", tag = "v0.9.3" }
# 版を固定する：naga が WGSL を訳す形が変わると、結果のビットが変わりうる。
# 上げるときは、回帰の基準を取り直してから。
wgpu = "=30.0.1"
# 時刻：ブラウザでも動く Instant（mikage と同じ crate）。
web-time = "1"

# 操作口（HTTP）はネイティブだけ：道具と回帰が、窓の絵と状態を読む。
[target.'cfg(not(target_family = "wasm"))'.dependencies]
mikage = { git = "https://github.com/necocen/mikage.git", tag = "v0.9.3", features = ["agent"] }
serde_json = "1"

[dev-dependencies]
pollster = "1.0"
png = "0.18.0"
sha2 = "0.10"
naga = { version = "=30.0.1", features = ["wgsl-in"] }
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }

[[bin]]
name = "sand-picture"
path = "src/bin/sand_picture.rs"
test = false

[[example]]
name = "run"
path = "tools/run.rs"
test = false

[[example]]
name = "check"
path = "tools/check.rs"
test = false

[features]
# 絵を窓の画素数で描かず、どの窓でも 1440×960 の絵を窓に合わせて拡大・縮小する。
# `cargo run --release --features fixed-picture`
fixed-picture = []

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Web 向け（trunk）：大きさを優先する。strip はしない（wasm の機能の一覧まで消えて、wasm-bindgen と wasm-opt が
# 使われている機能を読めなくなる。デバッグ情報は wasm-opt が落とす）。
[profile.web]
inherits = "release"
opt-level = "s"
strip = false
