# Web 版を Cloudflare Workers に置く設定（`mise run deploy`）。
# 配るのは trunk の出力（dist/）だけで、Worker のコードは無い。公開先は下の一つのドメインだけにする
# （workers.dev と、版ごとのプレビューの URL は出さない）。
name = "suna"
compatibility_date = "2026-11-22"
workers_dev = false
preview_urls = false
routes = [{ pattern = "suna.necocen.info", custom_domain = true }]

[assets]
directory = "./dist"
