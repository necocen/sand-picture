<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sand Picture</title>
    <link rel="icon" href="data:,">
    <link rel="license" href="licenses.txt">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05060a;
        }
        canvas {
            position: fixed;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #b9d4f5;
            font-family: sans-serif;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="loading">Loading…</div>
    <link data-trunk rel="rust" data-bin="sand-picture" data-wasm-opt="z" />
    <script>
        window.addEventListener("load", () => {
            // The overlay stays until the app's canvas appears.
            const hideLoading = () => {
                if (document.querySelector("canvas")) {
                    const loading = document.getElementById("loading");
                    if (loading) loading.style.display = "none";
                    return true;
                }
                return false;
            };
            const observer = new MutationObserver(() => {
                if (hideLoading()) observer.disconnect();
            });
            if (!hideLoading()) observer.observe(document.body, { childList: true, subtree: true });

            // A panic before the first frame (no WebGPU, for one) is said in place of the overlay.
            window.addEventListener("error", () => {
                const loading = document.getElementById("loading");
                if (loading && loading.style.display !== "none") {
                    loading.textContent = "This browser could not start WebGPU.";
                }
            });
        });
    </script>
</body>
</html>
